# Kara Dashboard — portal.pakhshmarket.com
# Install: sudo cp deploy/nginx/portal.pakhshmarket.com.conf /etc/nginx/sites-available/kara
#          sudo ln -sf /etc/nginx/sites-available/kara /etc/nginx/sites-enabled/kara
#          sudo nginx -t && sudo systemctl reload nginx

upstream kara_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.pakhshmarket.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.pakhshmarket.com;

    # Certbot fills these paths after: certbot --nginx -d portal.pakhshmarket.com
    ssl_certificate /etc/letsencrypt/live/portal.pakhshmarket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.pakhshmarket.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    access_log /var/log/nginx/kara-access.log;
    error_log /var/log/nginx/kara-error.log warn;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location /static/ {
        alias /var/lib/kara/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/lib/kara/media/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /health/ {
        proxy_pass http://kara_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /healthz/ {
        proxy_pass http://kara_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://kara_gunicorn;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
