<header class="kara-page-toolbar page-header">
    <div class="kara-page-toolbar__context page-header-copy">
        {% if page_eyebrow %}<span class="kara-page-toolbar__eyebrow page-eyebrow">{{ page_eyebrow }}</span>{% endif %}
        <h1 class="kara-page-toolbar__title page-title">{{ page_title }}</h1>
        {% if page_desc %}<p class="kara-page-toolbar__meta page-desc">{{ page_desc }}</p>{% endif %}
    </div>
    {% if page_actions_html %}
    <div class="kara-page-toolbar__actions page-header-actions">{{ page_actions_html }}</div>
    {% endif %}
</header>
