{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | داشبورد کارا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'reports/css/custom.css' %}?v=8">
</head>
<body class="kara-body kara-login-body">
    <div class="kara-bg" aria-hidden="true">
        <div class="kara-wash"></div>
        <div class="kara-grid"></div>
    </div>

    <main class="kara-login-wrap">
        <section class="kara-login-card">
            <div class="kara-login-brand">
                <span class="brand-mark"><i class="bi bi-shield-lock"></i></span>
                <div>
                    <h1>ورود به داشبورد کارا</h1>
                    <p>ویزیتورها و سرپرستان: کد پرسنلی · مدیران: نام کاربری</p>
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" class="kara-login-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label" for="login">کد پرسنلی یا نام کاربری</label>
                    <input type="text" class="form-control form-control-lg" id="login" name="login"
                           value="{{ login|default:'' }}" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">رمز عبور</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-kara-primary btn-lg w-100">
                    <i class="bi bi-box-arrow-in-left"></i> ورود
                </button>
            </form>

            <p class="kara-login-foot text-muted small mt-4 mb-0">
                دسترسی مدیریتی از طریق حساب staff/superuser در Django Admin قابل تعریف است.
            </p>
        </section>
    </main>
</body>
</html>
